site_name: Water Billing System
site_description: "Documentation for the water billing platform: meter reading, billing, payments, customer management"
site_author: NovaProtocol
repo_url: https://github.com/NovaProtocol/WaterBillingSystem
repo_name: NovaProtocol/WaterBillingSystem
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  font:
    text: Segoe UI
    code: Cascadia Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  generator: false

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.emoji
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - BillServer:
      - bill-server/index.md
      - Setup & Config: bill-server/setup.md
      - API Reference: bill-server/api-reference.md
      - Staff Portal: bill-server/staff-portal.md
      - Database Models: bill-server/models.md
      - Services: bill-server/services.md
      - Deployment: bill-server/deployment.md
  - MeterReadingApp:
      - meter-reading-app/index.md
      - Setup: meter-reading-app/setup.md
      - Screens & Components: meter-reading-app/screens.md
      - Sync Architecture: meter-reading-app/sync.md
      - NFC & QR Scanning: meter-reading-app/nfc-qr.md
  - Docker Infrastructure:
      - docker/index.md
  - API Contract:
      - api-contract/index.md
