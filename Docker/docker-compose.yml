services:
  waterbillingsystem_db:
    image: mysql:8.4
    container_name: waterbillingsystem_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  waterbillingsystem_main:
    image: ghcr.io/novaprotocol/waterbillingsystem:latest
    container_name: waterbillingsystem_main
    restart: unless-stopped
    ports:
      - "7000:5005"
    environment:
      - DEPLOYMENT_TYPE=PRODUCTION
      - DB_HOST=waterbillingsystem_db
      - DB_PORT=3306
      - CACHE_TYPE=SimpleCache
      - PYTHON_GIL=0
    env_file:
      - ../.env
    volumes:
      - db_backups:/app/db_backups
    depends_on:
      waterbillingsystem_db:
        condition: service_healthy

  waterbillingsystem_phpmyadmin:
    image: phpmyadmin:latest
    container_name: waterbillingsystem_phpmyadmin
    restart: unless-stopped
    ports:
      - "7002:80"
    environment:
      PMA_HOST: waterbillingsystem_db
    depends_on:
      - waterbillingsystem_db

  waterbillingsystem_documentation:
    image: python:3.14-slim
    container_name: waterbillingsystem_documentation
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        pip install -r requirements.txt --quiet &&
        echo '==> Starting docs...' &&
        exec mkdocs serve --dev-addr 0.0.0.0:8000
      "
    ports:
      - "7001:8000"
    volumes:
      - ../documentations:/app
    depends_on: []

volumes:
  mysql_data:
  db_backups:
