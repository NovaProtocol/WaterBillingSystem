services:
  db:
    image: mysql:8.4
    container_name: BillServerDB
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  billserver:
    image: ghcr.io/novaprotocol/waterbillingsystem:latest
    container_name: ws_app
    restart: unless-stopped
    ports:
      - "7000:5005"
    environment:
      DEPLOYMENT_TYPE: PRODUCTION
      DB_ENGINE: ${DB_ENGINE:-mysql+pymysql}
      DB_HOST: db
      DB_PORT: 3306
      CACHE_TYPE: SimpleCache
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASS: ${DB_PASS}
      SECRET_KEY: ${SECRET_KEY}
      NFC_PWD_SECRET: ${NFC_PWD_SECRET}
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ws_pma
    restart: unless-stopped
    ports:
      - "7002:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  mysql_data:
