<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cotta Realty — {% block title %}DEBUG{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #f5f5f5; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar-cotta { background: #1a1a2e !important; }
        .page-title { font-size: 1.6rem; font-weight: 700; padding: 1.5rem 0 1rem 0; }
        .card-cotta { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .card-header { font-weight: 600; background: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .navbar-brand span { color: #e94560; }
        .btn-outline-danger:hover { background: #e94560; border-color: #e94560; }
        .badge-danger { background: #e94560; }
        pre { background: #1a1a2e; color: #e0e0e0; padding: 1rem; border-radius: 8px; overflow-x: auto; }
        .task-item:hover { background: #f8f9fa; }
        .task-log::-webkit-scrollbar { width: 4px; }
        .task-log::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
        .bg-current { background: #e8f4ff; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-cotta">
    <a class="navbar-brand" href="/developer/">DEBUG <span>PANEL</span></a>
    <div class="ml-auto">
        <a href="/developer/logs" class="btn btn-outline-info btn-sm mr-2"><i class="fas fa-terminal mr-1"></i>Logs</a>
        <a href="/developer/phpmyadmin/" target="_blank" class="btn btn-outline-info btn-sm mr-2"><i class="fas fa-database mr-1"></i>phpMyAdmin</a>
        <a href="/staff/dashboard" class="btn btn-outline-light btn-sm mr-2">&larr; Staff Dashboard</a>
        <a href="/staff/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>
<div class="container-fluid" style="max-width:1400px;">
    {% block content %}{% endblock %}
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
