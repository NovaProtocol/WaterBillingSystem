<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cotta Realty — {% block title %}DEBUG{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/bootstrap/4.6.2/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/font-awesome/6.5.0/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/cotta.css') }}">
    {% block stylesheets %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-cotta">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/developer/">DEBUG <span>PANEL</span></a>
        <div class="ml-auto d-flex align-items-center" style="gap:0.5rem;">
            <a href="/developer/logs" class="btn btn-sm-cotta mr-1"><i class="fas fa-terminal mr-1"></i>Logs</a>
            <a href="/developer/phpmyadmin/" target="_blank" class="btn btn-outline-cotta btn-sm mr-1"><i class="fas fa-database mr-1"></i>phpMyAdmin</a>
            <a href="/staff/dashboard" class="btn btn-sm-cotta mr-1">&larr; Staff Dashboard</a>
            <a href="/staff/logout" class="btn btn-outline-cotta btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container-fluid" style="max-width:1400px;">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="{{ url_for('static', filename='assets/vendor/jquery/3.5.1/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/vendor/bootstrap/4.6.2/js/bootstrap.bundle.min.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
