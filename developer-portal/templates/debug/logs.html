{% extends "debug/base.html" %}
{% block title %}Logs{% endblock %}
{% block stylesheets %}{% endblock %}
{% block content %}
<div class="page-title"><i class="fas fa-terminal mr-2"></i>Live Logs</div>

<div class="card card-cotta">
  <div class="log-filter-bar">
    <label>Service
      <select id="filter-service">
        <option value="">All</option>
        <option value="api">api</option>
        <option value="staff-portal">staff-portal</option>
        <option value="customer-portal">customer-portal</option>
        <option value="developer-portal">developer-portal</option>
        <option value="landing-page">landing-page</option>
        <option value="webhook">webhook</option>
        <option value="documentation">documentation</option>
        <option value="worker">worker</option>
      </select>
    </label>
    <label>Level
      <select id="filter-level">
        <option value="">All</option>
        <option value="ERROR">ERROR</option>
        <option value="WARNING">WARNING</option>
        <option value="INFO">INFO</option>
        <option value="DEBUG">DEBUG</option>
      </select>
    </label>
    <label>Search
      <input type="text" id="filter-q" placeholder="text filter...">
    </label>
    <label class="mr-2" style="cursor:pointer;">
      <input type="checkbox" id="autorefresh" checked> Auto-refresh (5s)
    </label>
    <button class="btn btn-sm-cotta mr-1" onclick="loadLogs()">
      <i class="fas fa-sync-alt mr-1"></i>Refresh
    </button>
    <button class="btn btn-outline-cotta btn-sm" onclick="clearLogs()">
      <i class="fas fa-trash mr-1"></i>Clear
    </button>
  </div>

  <div class="log-header-row">
    <span class="log-time">Timestamp</span>
    <span class="log-level">Level</span>
    <span class="log-service">Service</span>
    <span style="flex:1;">Message</span>
  </div>

  <div id="logBody"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var refreshTimer = null;
var currentRows = [];

$('#filter-service, #filter-level, #filter-q').on('change', function() { loadLogs(); });
$('#filter-q').on('input', function() { loadLogs(); });

function loadLogs() {
  var service = $('#filter-service').val();
  var level = $('#filter-level').val();
  var q = $('#filter-q').val();
  $.getJSON('/developer/api/logs', {service: service, level: level, q: q, limit: 500}, function(res) {
    currentRows = res.data || [];
    renderLogs();
  });
}

function renderLogs() {
  var body = $('#logBody').empty();
  if (!currentRows.length) {
    body.append('<div class="text-center text-muted py-4">No logs match your filters.</div>');
    return;
  }
  currentRows.forEach(function(r) {
    var levelClass = 'level-' + r.level;
    var svcClass = 'log-service ' + (r.service || '');
    var msg = r.message || '';
    if (r.method) msg = r.method + ' ' + (r.path || '') + ' ' + (r.status_code || '') + ' [' + (r.container || '-') + ']';
    var row = $('<div class="log-row ' + levelClass + '"></div>');
    row.append('<span class="log-time">' + $('<span>').text(r.timestamp).html() + '</span>');
    row.append('<span class="log-level">' + $('<span>').text(r.level).html() + '</span>');
    row.append('<span class="' + svcClass + '">' + $('<span>').text(r.service || '').html() + '</span>');
    row.append('<span class="log-msg">' + $('<span>').text(msg).html() + '</span>');
    body.append(row);
  });
}

function clearLogs() {
  if (!confirm('Clear all log entries from all services?')) return;
  $.post('/developer/api/logs/clear', function() { loadLogs(); });
}

$(function() {
  loadLogs();
  refreshTimer = setInterval(function() {
    if ($('#autorefresh').is(':checked')) loadLogs();
  }, 5000);
});
</script>
{% endblock %}
