<div class="task-sidebar">
  <div class="task-sidebar-header">Task Logs <a href="{{ url_for('dev.task_logs') }}" class="text-muted ml-1" style="font-size:0.7rem;">full view &rarr;</a></div>
  <div class="task-sidebar-body" id="mini-tasks"></div>
</div>
<script>
(function() {
  var miniSnap = '';
  var miniStatusColor = {queued: '#6c757d', running: '#007bff', completed: '#28a745', error: '#dc3545', interrupted: '#fd7e14'};

  function miniPoll() {
    fetch('{{ url_for("dev.list_tasks") }}')
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(resp) {
        var snap = JSON.stringify(resp);
        if (snap === miniSnap) return;
        miniSnap = snap;

        var container = document.getElementById('mini-tasks');
        var current = resp.current;
        var history = (resp.history || []).slice(0, 10);
        var items = [];

        if (current) items.push({task: current, isCurrent: true});
        history.forEach(function(t) { items.push({task: t, isCurrent: false}); });

        var html = '';
        if (items.length === 0) {
          html = '<div class="mini-task text-muted" style="font-style:italic;">No recent tasks.</div>';
        } else {
          items.forEach(function(item) {
            var t = item.task;
            var color = miniStatusColor[t.status] || '#6c757d';
            var time = t.started_at ? t.started_at.substring(11, 19) : '';
            html += '<div class="mini-task" style="border-left:3px solid ' + color + ';">' +
              '<div class="mini-task-title">' + escHtml(t.title) + '</div>' +
              '<div class="mini-task-status" style="color:' + color + ';font-weight:600;">' + escHtml(t.status) + '</div>' +
              '<div class="mini-task-time">' + (t.started_at || 'queued') + '</div>' +
            '</div>';
          });
        }
        container.innerHTML = html;
      })
      .catch(function() {
        document.getElementById('mini-tasks').innerHTML =
          '<div class="mini-task text-muted" style="font-style:italic;">Unable to load tasks.</div>';
      });
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  setInterval(miniPoll, 3000);
  miniPoll();
})();
</script>
