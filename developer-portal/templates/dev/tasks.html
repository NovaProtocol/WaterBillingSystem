{% extends "dev/base.html" %}
{% block title %}Task History{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-title mb-0"><i class="fas fa-tasks mr-2 text-cotta"></i>Task History</h4>
</div>

<div class="row">
  <div class="col-12 mb-4">
    <div class="card card-cotta">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas fa-tasks mr-1 text-cotta"></i>Task History</span>
        <span>
          <span class="badge badge-secondary" id="task-count">0</span>
          <span class="badge badge-info ml-1 d-none" id="queue-depth">0 pending</span>
        </span>
      </div>
      <div class="card-body p-0">
        <div id="current-task"></div>
        <div id="history-tasks"></div>
        <div id="task-empty" class="text-muted text-center py-4 text-sm">No tasks yet</div>
      </div>
    </div>
  </div>
</div>

{% include "dev/_modals.html" %}
{% endblock %}

{% block scripts %}
<script>
window.DEV_URLS = window.DEV_URLS || {};
window.DEV_URLS.list_tasks = '{{ url_for("dev.list_tasks") }}';
</script>
<script src="/static/dev/js/tasks.js"></script>
{% endblock %}
