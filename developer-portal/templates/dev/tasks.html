{% extends "dev/base.html" %}
{% block title %}Task History{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-title mb-0"><i class="fas fa-tasks mr-2 text-cotta"></i>Task History</h4>
</div>

<div class="row">
  <div class="col-12 mb-4">
    <div class="card card-cotta">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas fa-tasks mr-1 text-cotta"></i>Task History</span>
        <span>
          <span class="badge badge-secondary" id="task-count">0</span>
          <span class="badge badge-info ml-1" id="queue-depth" style="display:none;">0 pending</span>
        </span>
      </div>
      <div class="card-body p-0">
        <div id="current-task"></div>
        <div id="history-tasks"></div>
        <div id="task-empty" class="text-muted text-center py-4 text-sm">No tasks yet</div>
      </div>
    </div>
  </div>
</div>

{% include "dev/_modals.html" %}
{% endblock %}

{% block scripts %}
<script>
var statusColor = {queued: '#6c757d', running: '#007bff', completed: '#28a745', error: '#dc3545', interrupted: '#fd7e14'};
var taskMessages = {};
var lastSnapshot = '';

function taskHtml(task, isCurrent) {
  var color = statusColor[task.status] || '#6c757d';
  var icon = task.status === 'running' ? 'fa-spinner fa-pulse'
    : task.status === 'completed' ? 'fa-check-circle'
    : task.status === 'error' ? 'fa-times-circle'
    : task.status === 'queued' ? 'fa-clock'
    : 'fa-circle';
  var msgs = task.messages || [];
  taskMessages[task.id] = msgs;
  var lastMsg = msgs.length ? msgs[msgs.length - 1] : '(no messages)';
  var cls = isCurrent ? 'task-item p-2 border-bottom bg-current' : 'task-item p-2 border-bottom';
  var progress = msgs.length
    ? '<div class="progress mt-1" style="height:6px;"><div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width:' + (task.progress || 0) + '%;background:' + color + ';"></div></div>'
    : '';
  var logLink = msgs.length > 1
    ? '<div class="mt-1"><a href="#" onclick="toggleLog(event, \'' + task.id + '\')" class="text-sm">Show log (' + msgs.length + ' messages)</a></div>'
    : '';

  return '<div class="' + cls + '" data-task-id="' + task.id + '">' +
    '<div class="d-flex justify-content-between align-items-center">' +
      '<span><i class="fas ' + icon + '" style="color:' + color + ';width:18px;"></i> <strong>' + task.title + '</strong></span>' +
      '<span style="color:' + color + ';font-weight:600;">' + task.status + '</span>' +
    '</div>' +
    progress +
    '<div class="text-muted mt-1 text-sm">' + lastMsg + '</div>' +
    logLink +
    '<div class="task-log mt-1" id="task-log-' + task.id + '" style="display:none;"></div>' +
  '</div>';
}

function toggleLog(e, taskId) {
  e.preventDefault();
  var el = document.getElementById('task-log-' + taskId);
  if (el.style.display === 'none') {
    el.style.display = 'block';
    el.textContent = (taskMessages[taskId] || []).join('\n');
  } else {
    el.style.display = 'none';
  }
}

function pollTasks() {
  fetch('{{ url_for("dev.list_tasks") }}')
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(resp) {
      var snap = JSON.stringify(resp);
      if (snap === lastSnapshot) return;
      lastSnapshot = snap;

      var count = document.getElementById('task-count');
      var depth = document.getElementById('queue-depth');
      var empty = document.getElementById('task-empty');
      var currentDiv = document.getElementById('current-task');
      var historyDiv = document.getElementById('history-tasks');

      var current = resp.current || null;
      var history = resp.history || [];

      count.textContent = (current ? 1 : 0) + history.length;

      if (resp.queue_depth > 0) {
        depth.style.display = 'inline';
        depth.textContent = resp.queue_depth + ' pending';
      } else {
        depth.style.display = 'none';
      }

      if (!current && !history.length) {
        empty.style.display = 'block';
        currentDiv.innerHTML = '';
        historyDiv.innerHTML = '';
        return;
      }
      empty.style.display = 'none';
      currentDiv.innerHTML = current ? taskHtml(current, true) : '';
      var h = '';
      history.forEach(function(t) { h += taskHtml(t, false); });
      historyDiv.innerHTML = h;
    })
    .catch(function() {});
}

setInterval(pollTasks, 3000);
pollTasks();
</script>
{% endblock %}
