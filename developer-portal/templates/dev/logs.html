{% extends "dev/base.html" %}
{% block title %}Logs{% endblock %}
{% block stylesheets %}{% endblock %}
{% block content %}
<div class="page-title"><i class="fas fa-terminal mr-2"></i>Live Logs</div>

<div class="card card-cotta">
  <div class="log-filter-bar">
    <label>Service
      <select id="filter-service">
        <option value="">All</option>
        <option value="api">api</option>
        <option value="staff-portal">staff-portal</option>
        <option value="customer-portal">customer-portal</option>
        <option value="developer-portal">developer-portal</option>
        <option value="landing-page">landing-page</option>
        <option value="webhook">webhook</option>
        <option value="documentation">documentation</option>
        <option value="worker">worker</option>
      </select>
    </label>
    <label>Level
      <select id="filter-level">
        <option value="">All</option>
        <option value="ERROR">ERROR</option>
        <option value="WARNING">WARNING</option>
        <option value="INFO">INFO</option>
        <option value="DEBUG">DEBUG</option>
      </select>
    </label>
    <label>Search
      <input type="text" id="filter-q" placeholder="text filter...">
    </label>
    <label class="mr-2" style="cursor:pointer;">
      <input type="checkbox" id="autorefresh" checked> Auto-refresh (5s)
    </label>
    <button class="btn btn-sm-cotta mr-1" onclick="loadLogs()">
      <i class="fas fa-sync-alt mr-1"></i>Refresh
    </button>
    <button class="btn btn-outline-cotta btn-sm" onclick="clearLogs()">
      <i class="fas fa-trash mr-1"></i>Clear
    </button>
  </div>

  <div class="table-responsive" style="max-height:calc(100vh - 320px);overflow-y:auto;">
    <table class="table table-sm table-cotta log-table mb-0" style="font-size:0.72rem;">
      <thead>
        <tr>
          <th style="width:160px;position:sticky;top:0;background:#f8f9fa;z-index:1;">Timestamp</th>
          <th style="width:55px;position:sticky;top:0;background:#f8f9fa;z-index:1;">Level</th>
          <th style="width:80px;position:sticky;top:0;background:#f8f9fa;z-index:1;">Service</th>
          <th style="position:sticky;top:0;background:#f8f9fa;z-index:1;">Message</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var refreshTimer = null;

$('#filter-service, #filter-level, #filter-q').on('change', function() { loadLogs(); });
$('#filter-q').on('input', function() { loadLogs(); });

function loadLogs() {
  var service = $('#filter-service').val();
  var level = $('#filter-level').val();
  var q = $('#filter-q').val();
  $.getJSON('/developer/api/logs', {service: service, level: level, q: q, limit: 500}, function(res) {
    renderLogs(res.data || []);
  });
}

function renderLogs(rows) {
  var tbody = $('#logBody').empty();
  if (!rows.length) {
    tbody.append('<tr><td colspan="4" class="text-center text-muted py-4">No logs match your filters.</td></tr>');
    return;
  }
  rows.forEach(function(r) {
    var levelClass = 'log-level-' + r.level;
    var svcClass = 'log-svc-' + (r.service || '');
    var msg = esc(r.message || '');
    tbody.append(
      '<tr class="' + levelClass + '">' +
        '<td class="log-ts">' + esc(r.timestamp) + '</td>' +
        '<td class="log-lvl font-weight-bold">' + esc(r.level) + '</td>' +
        '<td class="' + svcClass + '">' + esc(r.service || '') + '</td>' +
        '<td class="monospace log-msg">' + msg + '</td>' +
      '</tr>'
    );
  });
}

function esc(s) { return $('<span>').text(s).html(); }

function clearLogs() {
  if (!confirm('Clear all log entries from all services?')) return;
  $.post('/developer/api/logs/clear', function() { loadLogs(); });
}

$(function() {
  loadLogs();
  refreshTimer = setInterval(function() {
    if ($('#autorefresh').is(':checked')) loadLogs();
  }, 5000);
});
</script>
{% endblock %}
