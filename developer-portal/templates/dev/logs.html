{% extends "dev/base.html" %}
{% block title %}Logs{% endblock %}
{% block stylesheets %}{% endblock %}
{% block content %}
<h4 class="page-title"><i class="fas fa-terminal mr-2 text-cotta"></i>Live Logs</h4>

<div class="card card-cotta">
  <div class="log-filter-bar">
    <label>Service
      <select id="filter-service">
        <option value="">All</option>
        <option value="api">api</option>
        <option value="staff-portal">staff-portal</option>
        <option value="customer-portal">customer-portal</option>
        <option value="developer-portal">developer-portal</option>
        <option value="landing-page">landing-page</option>
        <option value="webhook">webhook</option>
        <option value="documentation">documentation</option>
        <option value="worker">worker</option>
      </select>
    </label>
    <label>Level
      <select id="filter-level">
        <option value="">All</option>
        <option value="ERROR">ERROR</option>
        <option value="WARNING">WARNING</option>
        <option value="INFO">INFO</option>
        <option value="DEBUG">DEBUG</option>
      </select>
    </label>
    <label>Search
      <input type="text" id="filter-q" placeholder="text filter...">
    </label>
    <label class="mr-2 cursor-pointer">
      <input type="checkbox" id="autorefresh" checked> Auto-refresh (5s)
    </label>
    <button class="btn btn-sm-cotta mr-1" onclick="loadLogs()">
      <i class="fas fa-sync-alt mr-1"></i>Refresh
    </button>
    <button class="btn btn-outline-cotta btn-sm" onclick="clearLogs()">
      <i class="fas fa-trash mr-1"></i>Clear
    </button>
  </div>

  <div class="table-responsive log-scroll">
    <table class="table table-sm table-cotta log-table mb-0">
      <thead>
        <tr>
          <th class="log-col-ts">Timestamp</th>
          <th class="log-col-lvl">Level</th>
          <th class="log-col-svc">Service</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/dev/js/logs.js"></script>
{% endblock %}
