services:

  caddy-gateway:
    build:
      context: .
      dockerfile: caddy-gateway/Dockerfile
    container_name: waterbillingsystem_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:7020:7020"
    networks:
      - net-public
      - net-private
      - gatekeeper

  landing-page:
    build:
      context: .
      dockerfile: landing-page/Dockerfile
    container_name: waterbillingsystem_landing
    restart: unless-stopped
    expose:
      - "8001"
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEBUG: ${DEBUG:?}
      CONTAINER_NAME: waterbillingsystem_landing
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX:-}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}

  customer-portal:
    build:
      context: .
      dockerfile: customer-portal/Dockerfile
    container_name: waterbillingsystem_customerportal
    restart: unless-stopped
    expose:
      - "8002"
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-public
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CONTAINER_NAME: waterbillingsystem_customerportal
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX:-}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8008}
      API_GRPC_ADDR: ${API_GRPC_ADDR:-api:50051}
      DEBUG: ${DEBUG:?}

  staff-portal:
    build:
      context: .
      dockerfile: staff-portal/Dockerfile
    container_name: waterbillingsystem_staffportal
    restart: unless-stopped
    expose:
      - "8003"
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-private
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEBUG: ${DEBUG:?}
      CONTAINER_NAME: waterbillingsystem_staffportal
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX:-}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8008}
      API_GRPC_ADDR: ${API_GRPC_ADDR:-api:50051}

  developer-portal:
    build:
      context: .
      dockerfile: developer-portal/Dockerfile
    container_name: waterbillingsystem_devportal
    restart: unless-stopped
    expose:
      - "8004"
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-private
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEBUG: ${DEBUG:?}
      CONTAINER_NAME: waterbillingsystem_devportal
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX:-}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8008}
      API_GRPC_ADDR: ${API_GRPC_ADDR:-api:50051}

  webhook-container:
    build:
      context: .
      dockerfile: webhook-container/Dockerfile
    container_name: waterbillingsystem_webhook
    restart: unless-stopped
    expose:
      - "8009"
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-public
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CONTAINER_NAME: waterbillingsystem_webhook
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8008}
      API_GRPC_ADDR: ${API_GRPC_ADDR:-api:50051}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: waterbillingsystem_api
    restart: unless-stopped
    expose:
      - "8008"
      - "50051"
    networks:
      - net-api
      - net-data
    volumes:
      - db_backups:/app/db_backups
      - app_logs:/var/log/app
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX:-}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      DB_ENGINE: ${DB_ENGINE:?}
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASS: ${DB_PASS:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      NFC_PWD_SECRET: ${NFC_PWD_SECRET:?}
      XENDIT_API_KEY: ${XENDIT_API_KEY:?}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:?}
      GUEST_DB_PASSWORD: ${GUEST_DB_PASSWORD:?}
      API_GRPC_ADDR: ${API_GRPC_ADDR:-api:50051}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8008}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql-db:
        condition: service_healthy

  background-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: waterbillingsystem_worker
    restart: unless-stopped
    expose:
      - "8006"
    networks:
      - net-data
      - net-api
    volumes:
      - db_backups:/app/db_backups
      - app_logs:/var/log/app
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      SECRET_KEY: ${SECRET_KEY:?}
      NFC_PWD_SECRET: ${NFC_PWD_SECRET:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX:-}
      WORKER_JOB_CONCURRENCY: ${WORKER_JOB_CONCURRENCY:-8}
      DB_ENGINE: ${DB_ENGINE:?}
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASS: ${DB_PASS:?}
      XENDIT_API_KEY: ${XENDIT_API_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:-http://api:8008}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8008}
      API_GRPC_ADDR: ${API_GRPC_ADDR:-api:50051}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql-db:
        condition: service_healthy
      api:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: waterbillingsystem_phpmyadmin
    restart: unless-stopped
    networks:
      - net-private
      - net-data
    environment:
      PMA_CONFIG_BASE64: ${PMA_CONFIG_BASE64:?}
      PMA_HOST: ${PMA_HOST:?}
      PMA_PORT: ${PMA_PORT:?}
      PMA_ARBITRARY: ${PMA_ARBITRARY:?}
      GUEST_DB_PASSWORD: ${GUEST_DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:?}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:?}
    depends_on:
      mysql-db:
        condition: service_healthy

  documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: waterbillingsystem_documentation
    restart: unless-stopped
    expose:
      - "8005"
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SECRET_KEY: ${SECRET_KEY:?}

  mysql-db:
    image: mysql:8.4
    container_name: waterbillingsystem_db
    restart: unless-stopped
    networks:
      - net-data
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?}
      MYSQL_DATABASE: ${DB_NAME:?}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  net-public:   { driver: bridge, internal: true }
  net-private:  { driver: bridge, internal: true }
  net-api:      { internal: true }
  net-data:     { internal: true }
  gatekeeper:
    external: true
    name: gatekeeper

volumes:
  mysql_data:
  db_backups:
  app_logs:
