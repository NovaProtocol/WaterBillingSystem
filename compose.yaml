services:

  caddy-gateway:
    build:
      context: .
      dockerfile: caddy-gateway/Dockerfile
    container_name: waterbillingsystem_gateway
    restart: unless-stopped
    ports:
      - "7020:7020"
      - "7021:7021"
    networks:
      - net-public
      - net-private
      - cloudflared-tunnel
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}

  landing-page:
    build:
      context: .
      dockerfile: landing-page/Dockerfile
    container_name: waterbillingsystem_landing
    restart: unless-stopped
    networks:
      - net-public
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}

  customer-portal:
    build:
      context: .
      dockerfile: customer-portal/Dockerfile
    container_name: waterbillingsystem_customerportal
    restart: unless-stopped
    networks:
      - net-public
      - net-api
      - net-gk
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL}
      DEBUG: ${DEBUG}

  staff-portal:
    build:
      context: .
      dockerfile: staff-portal/Dockerfile
    container_name: waterbillingsystem_staffportal
    restart: unless-stopped
    networks:
      - net-private
      - net-api
      - net-gk
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL}
      CACHE_TYPE: ${CACHE_TYPE}

  developer-portal:
    build:
      context: .
      dockerfile: developer-portal/Dockerfile
    container_name: waterbillingsystem_devportal
    restart: unless-stopped
    networks:
      - net-private
      - net-api
      - net-gk
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL}

  webhook-container:
    build:
      context: .
      dockerfile: webhook-container/Dockerfile
    container_name: waterbillingsystem_webhook
    restart: unless-stopped
    networks:
      - net-public
      - net-api
      - net-gk
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: waterbillingsystem_api
    restart: unless-stopped
    networks:
      - net-api
      - net-data
    volumes:
      - db_backups:/app/db_backups
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      DB_ENGINE: ${DB_ENGINE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASS: ${DB_PASS}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NFC_PWD_SECRET: ${NFC_PWD_SECRET}
      XENDIT_API_KEY: ${XENDIT_API_KEY}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN}
      CACHE_TYPE: ${CACHE_TYPE}
      PYTHON_GIL: ${PYTHON_GIL}
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      replicas: 1

  background-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: waterbillingsystem_worker
    restart: unless-stopped
    networks:
      - net-data
    volumes:
      - db_backups:/app/db_backups
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      DB_ENGINE: ${DB_ENGINE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASS: ${DB_PASS}
      XENDIT_API_KEY: ${XENDIT_API_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: waterbillingsystem_phpmyadmin
    restart: unless-stopped
    networks:
      - net-private
      - net-data
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_ARBITRARY: ${PMA_ARBITRARY:-0}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
    depends_on:
      mysql-db:
        condition: service_healthy

  documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: waterbillingsystem_documentation
    restart: unless-stopped
    networks:
      - net-private
      - net-gk
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL}

  mysql-db:
    image: mysql:8.4
    container_name: waterbillingsystem_db
    restart: unless-stopped
    networks:
      - net-data
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  net-public:   { driver: bridge }
  net-private:  { driver: bridge }
  net-api:      { internal: true }
  net-data:     { internal: true }
  net-gk:
    external: true
    name: gatekeeper_default
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default

volumes:
  mysql_data:
  db_backups:
