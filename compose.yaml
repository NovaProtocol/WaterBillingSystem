services:

  caddy-gateway:
    build:
      context: .
      dockerfile: caddy-gateway/Dockerfile
    container_name: waterbillingsystem_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:7020:7020"
      - "127.0.0.1:7021:7021"
    networks:
      - net-public
      - net-private
      - net-gk
      - cloudflared-tunnel

  landing-page:
    build:
      context: .
      dockerfile: landing-page/Dockerfile
    container_name: waterbillingsystem_landing
    restart: unless-stopped
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEBUG: ${DEBUG:?}
      CONTAINER_NAME: waterbillingsystem_landing
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}

  customer-portal:
    build:
      context: .
      dockerfile: customer-portal/Dockerfile
    container_name: waterbillingsystem_customerportal
    restart: unless-stopped
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-public
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CONTAINER_NAME: waterbillingsystem_customerportal
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}
      DEBUG: ${DEBUG:?}

  staff-portal:
    build:
      context: .
      dockerfile: staff-portal/Dockerfile
    container_name: waterbillingsystem_staffportal
    restart: unless-stopped
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-private
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEBUG: ${DEBUG:?}
      CONTAINER_NAME: waterbillingsystem_staffportal
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}

  developer-portal:
    build:
      context: .
      dockerfile: developer-portal/Dockerfile
    container_name: waterbillingsystem_devportal
    restart: unless-stopped
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-private
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEBUG: ${DEBUG:?}
      CONTAINER_NAME: waterbillingsystem_devportal
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}

  webhook-container:
    build:
      context: .
      dockerfile: webhook-container/Dockerfile
    container_name: waterbillingsystem_webhook
    restart: unless-stopped
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-public
      - net-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CONTAINER_NAME: waterbillingsystem_webhook
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      API_BASE_URL: ${API_BASE_URL:?}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: waterbillingsystem_api
    restart: unless-stopped
    networks:
      - net-public
      - net-api
      - net-data
    volumes:
      - db_backups:/app/db_backups
      - app_logs:/var/log/app
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX}
      SHARED_STATIC_DIR: ${SHARED_STATIC_DIR:?}
      SHARED_TEMPLATES_DIR: ${SHARED_TEMPLATES_DIR:?}
      DB_ENGINE: ${DB_ENGINE:?}
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASS: ${DB_PASS:?}
      SECRET_KEY: ${SECRET_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      NFC_PWD_SECRET: ${NFC_PWD_SECRET:?}
      XENDIT_API_KEY: ${XENDIT_API_KEY:?}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:?}
      GUEST_DB_PASSWORD: ${GUEST_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql-db:
        condition: service_healthy

  background-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: waterbillingsystem_worker
    restart: unless-stopped
    networks:
      - net-data
    volumes:
      - db_backups:/app/db_backups
      - app_logs:/var/log/app
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
      REVERSE_PROXY_PREFIX: ${REVERSE_PROXY_PREFIX}
      WORKER_JOB_CONCURRENCY: ${WORKER_JOB_CONCURRENCY:-8}
      DB_ENGINE: ${DB_ENGINE:?}
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASS: ${DB_PASS:?}
      XENDIT_API_KEY: ${XENDIT_API_KEY:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql-db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: waterbillingsystem_phpmyadmin
    restart: unless-stopped
    networks:
      - net-private
      - net-data
    environment:
      PMA_CONFIG_BASE64: ${PMA_CONFIG_BASE64:?}
      PMA_HOST: ${PMA_HOST:?}
      PMA_PORT: ${PMA_PORT:?}
      PMA_ARBITRARY: ${PMA_ARBITRARY:?}
      GUEST_DB_PASSWORD: ${GUEST_DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:?}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:?}
    depends_on:
      mysql-db:
        condition: service_healthy

  documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: waterbillingsystem_documentation
    restart: unless-stopped
    volumes:
      - app_logs:/var/log/app
    networks:
      - net-private
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?}
      SECRET_KEY: ${SECRET_KEY:?}

  mysql-db:
    image: mysql:8.4
    container_name: waterbillingsystem_db
    restart: unless-stopped
    networks:
      - net-data
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?}
      MYSQL_DATABASE: ${DB_NAME:?}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  net-public:   { driver: bridge }
  net-private:  { driver: bridge }
  net-api:      { internal: true }
  net-data:     { internal: true }
  net-gk:
    external: true
    name: gatekeeper_default
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default

volumes:
  mysql_data:
  db_backups:
  app_logs:
