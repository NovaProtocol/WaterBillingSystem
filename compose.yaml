services:

  caddy-gateway:
    build:
      context: .
      dockerfile: caddy-gateway/Dockerfile
    container_name: waterbillingsystem_gateway
    restart: unless-stopped
    ports:
      - "${CADDY_PORT_PUBLIC:-8001}:${CADDY_PORT_PUBLIC:-8001}"
      - "${CADDY_PORT_PRIVATE:-8001}:${CADDY_PORT_PRIVATE:-8001}"
    networks:
      - net-landing
      - net-customer
      - net-staff
      - net-debug
      - net-api-ext
      - tailscale-network_proxy_network
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      CADDY_PORT_PUBLIC: ${CADDY_PORT_PUBLIC:-8001}
      CADDY_PORT_PRIVATE: ${CADDY_PORT_PRIVATE:-8001}

  landing-page:
    build:
      context: .
      dockerfile: landing-page/Dockerfile
    container_name: waterbillingsystem_landing
    restart: unless-stopped
    networks:
      - net-landing
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}

  customer-portal:
    build:
      context: .
      dockerfile: customer-portal/Dockerfile
    container_name: waterbillingsystem_customerportal
    restart: unless-stopped
    networks:
      - net-customer
      - net-api-cust
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      DEBUG: ${DEBUG}

  staff-portal:
    build:
      context: .
      dockerfile: staff-portal/Dockerfile
    container_name: waterbillingsystem_staffportal
    restart: unless-stopped
    networks:
      - net-staff
      - net-api-staff
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      CACHE_TYPE: ${CACHE_TYPE}

  developer-portal:
    build:
      context: .
      dockerfile: developer-portal/Dockerfile
    container_name: waterbillingsystem_devportal
    restart: unless-stopped
    networks:
      - net-debug
      - net-api-debug
      - net-data
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_BASE_URL: ${API_BASE_URL}
      PMA_URL: ${PMA_URL}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    networks:
      - net-api-ext
      - net-api-cust
      - net-api-staff
      - net-api-debug
      - net-data
    volumes:
      - db_backups:/app/db_backups
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      DB_ENGINE: ${DB_ENGINE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASS: ${DB_PASS}
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NFC_PWD_SECRET: ${NFC_PWD_SECRET}
      XENDIT_API_KEY: ${XENDIT_API_KEY}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN}
      CACHE_TYPE: ${CACHE_TYPE}
      PYTHON_GIL: ${PYTHON_GIL}
    depends_on:
      mysql-db:
        condition: service_healthy
    deploy:
      replicas: 1

  background-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: waterbillingsystem_worker
    restart: unless-stopped
    networks:
      - net-data
    volumes:
      - db_backups:/app/db_backups
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE}
      DB_ENGINE: ${DB_ENGINE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASS: ${DB_PASS}
      XENDIT_API_KEY: ${XENDIT_API_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: waterbillingsystem_phpmyadmin
    restart: unless-stopped
    networks:
      - net-data
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_ARBITRARY: ${PMA_ARBITRARY}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      PMA_ABSOLUTE_URI: https://${TS_HOSTNAME:-water-billing-system.ghoul-aldebaran.ts.net}/developer/phpmyadmin/
    depends_on:
      mysql-db:
        condition: service_healthy

  mysql-db:
    image: mysql:8.4
    container_name: waterbillingsystem_db
    restart: unless-stopped
    networks:
      - net-data
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  net-landing:        { internal: true }
  net-customer:       { internal: true }
  net-staff:          { internal: true }
  net-debug:          { internal: true }
  net-api-ext:        { internal: true }
  net-api-cust:       { internal: true }
  net-api-staff:      { internal: true }
  net-api-debug:      { internal: true }
  net-data:           { internal: true }
  tailscale-network_proxy_network:
    external: true

volumes:
  mysql_data:
  db_backups:
