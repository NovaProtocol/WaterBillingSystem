[project]
name = "billserver"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
strict = false
warn_unused_configs = true
