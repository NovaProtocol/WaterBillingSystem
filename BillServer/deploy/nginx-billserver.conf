# BillServer reverse-proxy config for nginx
#
# This serves BillServer under a configurable URL prefix so
# it can live alongside other apps on the same domain.
#
# ── HOW TO USE ─────────────────────────────────────────────
#
# 1. Pick a SITE_PREFIX (e.g. /water-billing-system)
# 2. Replace __SITE_PREFIX__ below with your prefix
# 3. Include this file in your nginx server block:
#
#     server {
#         listen 443 ssl;
#         server_name raspberrypi.tailbb70f8.ts.net;
#         ssl_certificate     /path/to/cert.pem;
#         ssl_certificate_key /path/to/key.pem;
#
#         include /path/to/nginx-billserver.conf;
#     }
#
# ── FLASK CONFIG ───────────────────────────────────────────
#
# In Dockge (or your .env / docker compose environment):
#   REVERSE_PROXY_PREFIX = true
#
# This enables Flask's ProxyFix middleware so url_for(),
# redirect(), and static URLs all respect the prefix.
#
# Example final URLs:
#   https://raspberrypi.tailbb70f8.ts.net/water-billing-system
#   https://raspberrypi.tailbb70f8.ts.net/water-billing-system/offerings/catherine-4
#   https://raspberrypi.tailbb70f8.ts.net/water-billing-system/static/assets/...
#   https://raspberrypi.tailbb70f8.ts.net/water-billing-system/billing/api/...
#
# ── REFERENCE ──────────────────────────────────────────────
#
# The SITE_PREFIX __SITE_PREFIX__ is configurable:
#   n/a / empty  → serve at root (http://host:7000)
#   /anything    → serve under /anything path
#
# DO NOT include a trailing slash in __SITE_PREFIX__.

location /__SITE_PREFIX__/ {

    # Strip the prefix before proxying; Flask's ProxyFix
    # reconstructs it from X-Forwarded-Prefix.
    proxy_pass http://127.0.0.1:5005/;

    # Standard proxy headers
    proxy_set_header Host                  $host;
    proxy_set_header X-Real-IP             $remote_addr;
    proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto     $scheme;
    proxy_set_header X-Forwarded-Host      $host;

    # This header tells Flask the original prefix
    # so url_for() generates correct URLs.
    # Flask only reads this when REVERSE_PROXY_PREFIX is set.
    proxy_set_header X-Forwarded-Prefix    /__SITE_PREFIX__;

    # WebSocket / long-lived connections (not used, harmless)
    proxy_http_version 1.1;
    proxy_set_header Upgrade              $http_upgrade;
    proxy_set_header Connection           "upgrade";

    # Timeouts
    proxy_connect_timeout                 60s;
    proxy_send_timeout                    60s;
    proxy_read_timeout                    60s;
}
