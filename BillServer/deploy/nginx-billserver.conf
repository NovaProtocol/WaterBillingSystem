# BillServer reverse-proxy location block (drop into your nginx site config)
#
# Usage:
#   Include this in an existing server block that terminates TLS:
#     server {
#         listen 443 ssl;
#         server_name raspberrypi.tailbb70f8.ts.net;
#         ssl_certificate ...;
#         ssl_certificate_key ...;
#
#         include /path/to/nginx-billserver.conf;
#     }

location /bill-server/ {

    # Strip /bill-server prefix; Flask's ProxyFix reconstructs it
    proxy_pass http://127.0.0.1:5005/;

    # Standard proxy headers
    proxy_set_header Host                  $host;
    proxy_set_header X-Real-IP             $remote_addr;
    proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto     $scheme;
    proxy_set_header X-Forwarded-Host      $host;

    # Tell Flask the original prefix so url_for() generates correct URLs
    proxy_set_header X-Forwarded-Prefix    /bill-server;

    # WebSocket / long-lived connections (not used by BillServer, but harmless)
    proxy_http_version 1.1;
    proxy_set_header Upgrade              $http_upgrade;
    proxy_set_header Connection           "upgrade";

    # Timeouts
    proxy_connect_timeout                 60s;
    proxy_send_timeout                    60s;
    proxy_read_timeout                    60s;
}
