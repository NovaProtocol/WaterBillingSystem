<div class="modal modal-app fade" id="customerModal" tabindex="-1" role="dialog" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title modal-app-title">
                    <i class="fas fa-file-invoice"></i> <span id="modal-title-text">Check Your Bill</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
                    
                </button>
            </div>

            <div id="modal-lookup">
                <div class="modal-body">
                    <p class="modal-description">Enter your customer number and last receipt number to verify your account.</p>
                    <div class="form-group">
                        <label class="form-label">Customer Number</label>
                        <input type="text" id="lookup-customer-number" class="form-control lookup-input" required
                               placeholder="e.g. 1">
                    </div>
                    <div class="form-group mb-0">
                        <label class="form-label">Last Receipt Number</label>
                        <input type="text" id="lookup-receipt-number" class="form-control lookup-input"
                               style="{% if config.get('DEBUG_ENABLED') %}background: #f0f0f0;{% endif %}"
                               placeholder="{% if config.get('DEBUG_ENABLED') %}(optional in DEBUG mode){% else %}e.g. RCP-2026-001{% endif %}"
                               {% if config.get('DEBUG_ENABLED') %}readonly{% else %}required{% endif %}>
                    </div>
                </div>
                <div class="modal-footer lookup-modal-footer">
                    <button type="button" class="btn btn-bill w-100" id="lookup-btn">
                        <i class="fas fa-search me-2"></i>Look Up
                    </button>
                </div>
            </div>

            <div id="modal-confirm" class="init-hidden">
                <div class="modal-body">
                    <p class="lookup-confirm-text">Is this you?</p>
                    <div class="row">
                        <div class="col-md-6">
                            <table class="table table-sm table-font-sm2">
                                <tr><th class="lookup-confirm-th">Customer #</th><td class="lookup-confirm-td" id="confirm-customer-number"></td></tr>
                                <tr><th class="lookup-confirm-th">Name</th><td class="lookup-confirm-td" id="confirm-name"></td></tr>
                                <tr><th class="lookup-confirm-th">Address</th><td class="lookup-confirm-td" id="confirm-address"></td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <div id="confirm-map" class="lookup-confirm-map"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer modal-app-footer-flex justify-content-between">
                    <button type="button" class="btn btn-outline" id="back-btn">
                        <i class="fas fa-arrow-left me-2"></i>No, go back
                    </button>
                    <button type="button" class="btn btn-bill" id="confirm-btn">
                        <i class="fas fa-check me-2"></i>Yes, this is my account
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var customerData = null;
    var lastReceipt = '';
    var DEBUG = {% if config.get('DEBUG_ENABLED') %}true{% else %}false{% endif %};

    function showLookup(show) {
        document.getElementById('modal-lookup').style.display = show ? '' : 'none';
        document.getElementById('modal-confirm').style.display = show ? 'none' : '';
    }

    function postJSON(url, body) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (data) {
                if (!r.ok) {
                    var inner = data && data.error;
                    throw new Error((inner && (inner.message || inner)) || 'Request failed.');
                }
                return data;
            });
        });
    }

    function doLookup() {
        var num = document.getElementById('lookup-customer-number').value.trim();
        var receipt = document.getElementById('lookup-receipt-number').value.trim();
        lastReceipt = receipt;
        if (!num) { alert('Please enter a customer number.'); return; }
        if (!DEBUG && !receipt) { alert('Please enter your last receipt number for verification.'); return; }
        postJSON('{{ "/customer/api/verify" }}', { account_number: num, last_receipt: receipt })
            .then(function (data) {
                customerData = data.customer;
                document.getElementById('confirm-customer-number').textContent = data.customer.customer_number;
                document.getElementById('confirm-name').textContent = data.customer.name || '-';
                document.getElementById('confirm-address').textContent = data.customer.address || '-';
                showLookup(false);
                if (data.customer.x_coordinate && data.customer.y_coordinate) {
                    setTimeout(function () {
                        var el = document.getElementById('confirm-map');
                        if (el) {
                            var map = L.map(el, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, keyboard: false }).setView([data.customer.x_coordinate, data.customer.y_coordinate], 15);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                            L.marker([data.customer.x_coordinate, data.customer.y_coordinate]).addTo(map);
                        }
                    }, 400);
                }
            })
            .catch(function (err) {
                alert(err && err.message ? err.message : 'Verification failed. Check your customer number and receipt number.');
            });
    }

    document.getElementById('lookup-btn').addEventListener('click', doLookup);
    ['lookup-customer-number', 'lookup-receipt-number'].forEach(function (id) {
        document.getElementById(id).addEventListener('keypress', function (e) {
            if (e.which === 13) doLookup();
        });
    });

    document.getElementById('back-btn').addEventListener('click', function () {
        showLookup(true);
    });

    document.getElementById('confirm-btn').addEventListener('click', function () {
        if (!customerData) return;
        postJSON('{{ "/customer/api/login" }}', { account_number: customerData.customer_number, last_receipt: lastReceipt })
            .then(function (data) {
                closeModal(document.getElementById('customerModal'));
                window.location.href = data.redirect || '/customer/';
            })
            .catch(function () { alert('Failed to confirm. Please try again.'); });
    });
</script>
