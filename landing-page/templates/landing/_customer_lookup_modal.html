<div class="modal modal-cotta fade" id="customerModal" tabindex="-1" role="dialog" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title modal-cotta-title">
                    <i class="fas fa-file-invoice"></i> <span id="modal-title-text">Check Your Bill</span>
                </h5>
                <button type="button" class="close modal-cotta-close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div id="modal-lookup">
                <div class="modal-body">
                    <p class="modal-description">Enter your customer number and last receipt number to verify your account.</p>
                    <div class="form-group">
                        <label class="form-label">Customer Number</label>
                        <input type="text" id="lookup-customer-number" class="form-control lookup-input" required
                               placeholder="e.g. CRDC-0001">
                    </div>
                    <div class="form-group mb-0">
                        <label class="form-label">Last Receipt Number</label>
                        <input type="text" id="lookup-receipt-number" class="form-control lookup-input"
                               style="{% if config.get('DEBUG_ENABLED') %}background: #f0f0f0;{% endif %}"
                               placeholder="{% if config.get('DEBUG_ENABLED') %}(optional in DEBUG mode){% else %}e.g. RCP-2026-001{% endif %}"
                               {% if config.get('DEBUG_ENABLED') %}readonly{% else %}required{% endif %}>
                    </div>
                </div>
                <div class="modal-footer lookup-modal-footer">
                    <button type="button" class="btn btn-bill w-100" id="lookup-btn">
                        <i class="fas fa-search mr-2"></i>Look Up
                    </button>
                </div>
            </div>

            <div id="modal-confirm" class="init-hidden">
                <div class="modal-body">
                    <p class="lookup-confirm-text">Is this you?</p>
                    <div class="row">
                        <div class="col-md-6">
                            <table class="table table-sm table-font-sm2">
                                <tr><th class="lookup-confirm-th">Customer #</th><td class="lookup-confirm-td" id="confirm-customer-number"></td></tr>
                                <tr><th class="lookup-confirm-th">Name</th><td class="lookup-confirm-td" id="confirm-name"></td></tr>
                                <tr><th class="lookup-confirm-th">Address</th><td class="lookup-confirm-td" id="confirm-address"></td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <div id="confirm-map" class="lookup-confirm-map"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer modal-cotta-footer-flex justify-content-between">
                    <button type="button" class="btn btn-outline" id="back-btn">
                        <i class="fas fa-arrow-left mr-2"></i>No, go back
                    </button>
                    <button type="button" class="btn btn-bill" id="confirm-btn">
                        <i class="fas fa-check mr-2"></i>Yes, this is my account
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var customerData = null;

    function doLookup() {
        var num = $('#lookup-customer-number').val().trim();
        var receipt = $('#lookup-receipt-number').val().trim();
        if (!num) { alert('Please enter a customer number.'); return; }
        {% if not config.get('DEBUG_ENABLED') %}
        if (!receipt) { alert('Please enter your last receipt number for verification.'); return; }
        {% endif %}
        $.ajax({
            url: '{{ "/customer/" }}',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ customer_number: num, last_receipt: receipt }),
            success: function(data) {
                customerData = data;
                $('#confirm-customer-number').text(data.customer_number);
                $('#confirm-name').text(data.name || '-');
                $('#confirm-address').text(data.address || '-');
                $('#modal-lookup').hide();
                $('#modal-confirm').show();
                if (data.x_coordinate && data.y_coordinate) {
                    setTimeout(function() {
                        var el = document.getElementById('confirm-map');
                        if (el) {
                            var map = L.map(el, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, keyboard: false }).setView([data.x_coordinate, data.y_coordinate], 15);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                            L.marker([data.x_coordinate, data.y_coordinate]).addTo(map);
                        }
                    }, 400);
                }
            },
            error: function(xhr) {
                var msg = 'Verification failed. Check your customer number and receipt number.';
                try { var r = JSON.parse(xhr.responseText); msg = r.error; } catch(e) {}
                alert(msg);
            }
        });
    }

    $('#lookup-btn').on('click', doLookup);
    $('#lookup-customer-number, #lookup-receipt-number').on('keypress', function(e) {
        if (e.which === 13) doLookup();
    });

    $('#back-btn').on('click', function() {
        $('#modal-confirm').hide();
        $('#modal-lookup').show();
    });

    $('#confirm-btn').on('click', function() {
        if (!customerData) return;
        $.ajax({
            url: '{{ "/customer/" }}',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ customer_number: customerData.customer_number }),
            success: function(data) {
                $('#customerModal').modal('hide');
                window.location.href = data.redirect;
            },
            error: function() {
                alert('Failed to confirm. Please try again.');
            }
        });
    });
</script>
